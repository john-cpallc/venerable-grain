---
layout: default
---
<article class="piece">
  <header class="piece__header">
    <p class="eyebrow">{{ page.category | default: "Work" }}</p>
    <h1 class="piece__title">{{ page.title }}</h1>
    {% if page.wood %}
    <p class="piece__meta">{{ page.wood }}</p>
    {% endif %}
  </header>
  {% if page.image %}
  <figure class="piece__figure">
    <img src="{{ page.image | relative_url }}" alt="{{ page.title }}" loading="lazy">
  </figure>
  {% endif %}
  <div class="prose">
    {{ content }}
  </div>
  {% if page.story %}
  <p class="piece__story-link">
    <a href="{{ page.story | relative_url }}">Read the process story</a>
  </p>
  {% endif %}
  <p class="back-link"><a href="{{ '/work/' | relative_url }}">← All work</a></p>
</article>
