title: "Venerable Grain"
description: "Solid hardwood furniture, repair, and commissions — joinery over hardware."
url: "https://venerablegrain.com"
baseurl: ""
repository: "john-cpallc/venerable-grain"

email: "hello@venerablegrain.com"

# Sketch tool (Cloudflare Worker). Leave api blank to hide Generate until deployed.
imagine:
  api: "https://imagine.venerablegrain.com"
  turnstile_site_key: ""

permalink: pretty

include:
  - _pages

collections:
  pieces:
    output: true
    permalink: /collection/:name/
  stories:
    output: true
    permalink: /stories/:name/

defaults:
  - scope:
      path: ""
      type: pages
    values:
      layout: default
  - scope:
      path: ""
      type: pieces
    values:
      layout: piece
  - scope:
      path: ""
      type: stories
    values:
      layout: story

plugins:
  - jekyll-sitemap
  - jekyll-seo-tag

exclude:
  - Gemfile
  - Gemfile.lock
  - vendor
  - README.md
  - .gitignore
  - .github
  - worker
